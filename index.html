<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منصة إدارة الجودة والاعتماد</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="workspaceGate" class="workspace-gate" hidden><div class="workspace-shell"><div class="workspace-brand"><span class="workspace-mark">QA</span><div><h1>منصة إدارة الجودة والاعتماد</h1><p>اختر مساحة العمل للمتابعة دون خلط بيانات الفريقين</p></div></div><div class="workspace-options"><button class="workspace-card institutional" onclick="selectWorkspace('institutional')"><span class="workspace-icon">I</span><strong>الاعتماد المؤسسي</strong><small>المعيار 7 • 6 مؤشرات رسمية • إصدار 2015 المعدل</small></button><button class="workspace-card program" onclick="selectWorkspace('program')"><span class="workspace-icon">P</span><strong>الاعتماد البرامجي</strong><small>المعيار P2: تصميم البرنامج • 8 مؤشرات • إصدار 2022 المعدل</small></button></div><p class="workspace-note">يمكن تغيير مساحة العمل في أي وقت. تحفظ كل مساحة بياناتها بشكل منفصل في المتصفح.</p></div></div>
<div id="siteShell" hidden><header><div><div class="workspace-badge" id="workspaceBadge"></div><h1 id="siteTitle">إدارة الجودة والاعتماد</h1><p id="siteSubtitle"></p></div><div class="actions"><button class="secondary-btn" onclick="changeWorkspace()">تغيير مساحة العمل</button><button onclick="exportData()">تصدير JSON</button><label class="btn">استيراد JSON<input id="importFile" type="file" accept="application/json" hidden></label><button class="danger" onclick="resetData()">إعادة ضبط المساحة</button></div></header><nav id="nav"></nav><main id="app"></main><footer>الحفظ منفصل لكل مساحة في المتصفح • استخدموا التصدير والاستيراد لتبادل آخر نسخة</footer></div>
<script src="app.js"></script></body></html>
